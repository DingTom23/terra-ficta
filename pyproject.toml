[project]
name = "terra-ficta"
version = "0.6.0"
description = "Terra Ficta: a deterministic procedural cartography engine. Seeds in, antique maps out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas"]
