<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — the plates</title>
<style>
  :root {
    --paper:#efe7d3; --ink:#2e2620; --soft:#6b5c4d;
    --night:#17140f; --panel:#211c16; --rule:#3a322a;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--night); color:var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    display:grid; grid-template-columns: 300px 1fr; overflow:hidden;
  }

  aside {
    background:var(--panel); border-right:1px solid var(--rule);
    display:flex; flex-direction:column; overflow:hidden;
  }
  aside h1 {
    margin:0; padding:26px 22px 6px; font-weight:400; font-size:20px;
    letter-spacing:.30em; text-transform:uppercase;
  }
  aside .tag { padding:0 22px 18px; color:#8d7f70; font-style:italic; font-size:13px; }
  .list { overflow-y:auto; flex:1; padding-bottom:20px; }
  .item {
    padding:14px 22px; cursor:pointer; border-left:3px solid transparent;
    display:flex; gap:12px; align-items:baseline;
  }
  .item:hover { background:#2a241d; }
  .item.on { background:#332b22; border-left-color:#c8a56a; }
  .item .num { color:#8d7f70; font-size:12px; letter-spacing:.16em; min-width:52px; }
  .item .nm { font-size:15px; letter-spacing:.04em; }

  main { position:relative; overflow:hidden; cursor:grab; }
  main.drag { cursor:grabbing; }
  #stage { position:absolute; inset:0; }
  #plate {
    position:absolute; left:50%; top:50%; transform-origin:center;
    will-change:transform; box-shadow:0 30px 90px rgba(0,0,0,.65);
    user-select:none; -webkit-user-drag:none; max-width:none;
  }
  #hud {
    position:absolute; left:0; right:0; bottom:0; padding:20px 26px 22px;
    background:linear-gradient(transparent, rgba(10,8,6,.92) 55%);
    pointer-events:none;
  }
  #hud h2 {
    margin:0 0 4px; font-weight:400; font-size:22px; letter-spacing:.14em;
    text-transform:uppercase;
  }
  #hud .sub { margin:0 0 10px; color:#b3a390; font-style:italic; font-size:14px; }
  #hud p { margin:0; max-width:70ch; line-height:1.6; font-size:14px; color:#ded3bf; }
  .zoom { position:absolute; right:20px; top:18px; display:flex; gap:8px; }
  .zoom button {
    width:34px; height:34px; border-radius:50%; border:1px solid var(--rule);
    background:rgba(33,28,22,.85); color:var(--paper); font-size:17px; cursor:pointer;
  }
  .zoom button:hover { background:#3a3128; }
</style>
</head>
<body>
  <aside>
    <h1>Atlas</h1>
    <div class="tag">countries that were never surveyed</div>
    <div class="list" id="list"></div>
  </aside>

  <main id="main">
    <div id="stage"><img id="plate" alt=""></div>
    <div class="zoom">
      <button id="in" title="zoom in">+</button>
      <button id="out" title="zoom out">&minus;</button>
      <button id="fit" title="fit">&#9633;</button>
    </div>
    <div id="hud">
      <h2 id="t"></h2>
      <p class="sub" id="s"></p>
      <p id="p"></p>
    </div>
  </main>

<script>
const PLATES = [{"image": "atlas_0001.png", "title": "Chouchuldora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Chouchuldora lies between the 12th and 56th parallels, and holds 40 parts land to 60 of water. The Baibesvau breaks upon its western shore, and the Zosveisvol closes it to the east.", "The ground rises to 3,119 metres. The Siseiseli carry the highest of it.", "The Khouceitreir is the longest of the rivers shown, 2,770 kilometres from its source to the sea. The Dridredraulau is next at 2,500 kilometres, draining 1,734,000 square kilometres. Lakes take up 8.1 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Hauhistora, Wourolreach, Rekaistath, Skofia and Wabolholt, of which Hauhistora is the largest at 3,686,000 square kilometres. The seat is at Draipeingate. No part of this country has been visited twice."], "plate": "PLATE I"}, {"image": "atlas_0001_political.png", "title": "Chouchuldora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE II"}, {"image": "atlas_0003.png", "title": "Svaevraereach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Svaevraereach lies between the 12th and 58th parallels, and holds 41 parts land to 59 of water. The Sauhi lies off its eastern shore.", "The ground rises to 3,315 metres. The Stishigai carry the highest of it.", "The Skoskogei is the longest of the rivers shown, 2,910 kilometres from its source to the sea. The Caelousae is next at 2,220 kilometres, draining 893,000 square kilometres. Lakes take up 6.9 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Givailia, Svegialdora, Skouwisath, Hitheinmoor and Hishiheim, of which Givailia is the largest at 3,564,000 square kilometres. The seat is at Dhoustouford, and Zicegate stands furthest from its neighbours, 1,679 kilometres. No part of this country has been visited twice."], "plate": "PLATE III"}, {"image": "atlas_0003_political.png", "title": "Svaevraereach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE IV"}, {"image": "atlas_0004.png", "title": "Gianiareach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Gianiareach lies between the 12th and 52th parallels, and holds 39 parts land to 61 of water. The Moupou breaks upon its western shore, and the Kouglausk closes it to the east.", "The ground rises to 3,415 metres. The Kouyoukau carry the highest of it.", "The Saiyourk is the longest of the rivers shown, 2,160 kilometres from its source to the sea. The Naulautrusk is next at 1,980 kilometres, draining 1,631,000 square kilometres. Lakes take up 8.7 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Gutrureach, Kaleimoor, Gougiasreach, Paupoora and Vrauskaath, of which Gutrureach is the largest at 4,268,000 square kilometres. The seat is at Cauzausholm, and Lolaushaven stands furthest from its neighbours, 1,909 kilometres. No part of this country has been visited twice."], "plate": "PLATE V"}, {"image": "atlas_0004_political.png", "title": "Gianiareach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE VI"}, {"image": "atlas_0007.png", "title": "Dhiapirnora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Dhiapirnora lies between the 12th and 58th parallels, and holds 41 parts land to 59 of water.", "The ground rises to 3,231 metres. The Virourask carry the highest of it.", "The Cheicaugrau is the longest of the rivers shown, 2,440 kilometres from its source to the sea. The Gamidreir is next at 1,980 kilometres, draining 1,380,000 square kilometres. Lakes take up 5.8 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Dhiapirnora, Dumirland, Thogrianvale, Kiasausland and Beirunholt, of which Dhiapirnora is the largest at 3,154,000 square kilometres. The seat is at Tupiaburg, and Caestaenhaven stands furthest from its neighbours, 1,440 kilometres. No part of this country has been visited twice."], "plate": "PLATE VII"}, {"image": "atlas_0007_political.png", "title": "Dhiapirnora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE VIII"}, {"image": "atlas_0012.png", "title": "Chebraora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Chebraora lies between the 12th and 55th parallels, and holds 41 parts land to 59 of water.", "The ground rises to 3,474 metres. The Brubrum carry the highest of it.", "The Naebrachausk is the longest of the rivers shown, 3,050 kilometres from its source to the sea. The Brauchouskoum is next at 2,530 kilometres, draining 1,475,000 square kilometres. Lakes take up 7.1 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Chebraora, Shonomoor, Kheidraath, Vreiheesse and Glupuswyn, of which Chebraora is the largest at 3,640,000 square kilometres. The seat is at Bagrestead, and Naebreford stands furthest from its neighbours, 1,523 kilometres. No part of this country has been visited twice."], "plate": "PLATE IX"}, {"image": "atlas_0012_political.png", "title": "Chebraora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE X"}, {"image": "atlas_0021.png", "title": "Khuvrurkath", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Khuvrurkath lies between the 15th and 54th parallels, and holds 39 parts land to 61 of water.", "The ground rises to 3,316 metres. The Skunoskukhu are the highest ground the survey names, reaching 2,960 metres.", "The Pauskaikhau is the longest of the rivers shown, 2,330 kilometres from its source to the sea. The Shaemamou is next at 1,490 kilometres, draining 926,000 square kilometres. Lakes take up 7.3 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Griawiathath, Youdrougard, Staicoesse, Rustotmoor and Theidreisesse, of which Griawiathath is the largest at 3,237,000 square kilometres. The seat is at Pudhaiburg, and Yodrahaven stands furthest from its neighbours, 984 kilometres. No part of this country has been visited twice."], "plate": "PLATE XI"}, {"image": "atlas_0021_political.png", "title": "Khuvrurkath", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE XII"}];
const img = document.getElementById('plate');
const main = document.getElementById('main');
const list = document.getElementById('list');
let cur = 0, scale = 1, tx = 0, ty = 0, base = 1;

function fitScale() {
  const pw = img.naturalWidth || 1, ph = img.naturalHeight || 1;
  const availW = main.clientWidth * 0.94, availH = main.clientHeight * 0.90;
  return Math.min(availW / pw, availH / ph);
}

function apply() {
  img.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`;
}

function reset() {
  base = fitScale();
  scale = base; tx = 0; ty = 0; apply();
}

function show(i) {
  cur = (i + PLATES.length) % PLATES.length;
  const d = PLATES[cur];
  img.src = d.image;
  document.getElementById('t').textContent = (d.plate ? d.plate + ' · ' : '') + d.title;
  document.getElementById('s').textContent = d.subtitle;
  document.getElementById('p').textContent = d.paras[0];
  [...list.children].forEach((el, k) => el.classList.toggle('on', k === cur));
  img.onload = reset;
}

PLATES.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<span class="num">${d.plate || ''}</span><span class="nm">${d.title}</span>`;
  el.onclick = () => show(i);
  list.appendChild(el);
});

main.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0016);
  const next = Math.min(Math.max(scale * k, base * 0.6), base * 12);
  const r = main.getBoundingClientRect();
  const mx = e.clientX - r.left - r.width / 2;
  const my = e.clientY - r.top - r.height / 2;
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next; apply();
}, { passive: false });

let down = false, lx = 0, ly = 0;
main.addEventListener('pointerdown', e => {
  down = true; lx = e.clientX; ly = e.clientY; main.classList.add('drag');
});
window.addEventListener('pointerup', () => { down = false; main.classList.remove('drag'); });
window.addEventListener('pointermove', e => {
  if (!down) return;
  tx += e.clientX - lx; ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY; apply();
});

document.getElementById('in').onclick = () => { scale *= 1.35; apply(); };
document.getElementById('out').onclick = () => { scale /= 1.35; apply(); };
document.getElementById('fit').onclick = reset;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
window.addEventListener('resize', reset);

show(0);
</script>
</body>
</html>
