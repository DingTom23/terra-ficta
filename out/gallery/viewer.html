<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — the plates</title>
<style>
  :root {
    --paper:#efe7d3; --ink:#2e2620; --soft:#6b5c4d;
    --night:#17140f; --panel:#211c16; --rule:#3a322a;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--night); color:var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    display:grid; grid-template-columns: 300px 1fr; overflow:hidden;
  }

  aside {
    background:var(--panel); border-right:1px solid var(--rule);
    display:flex; flex-direction:column; overflow:hidden;
  }
  aside h1 {
    margin:0; padding:26px 22px 6px; font-weight:400; font-size:20px;
    letter-spacing:.30em; text-transform:uppercase;
  }
  aside .tag { padding:0 22px 18px; color:#8d7f70; font-style:italic; font-size:13px; }
  .list { overflow-y:auto; flex:1; padding-bottom:20px; }
  .item {
    padding:14px 22px; cursor:pointer; border-left:3px solid transparent;
    display:flex; gap:12px; align-items:baseline;
  }
  .item:hover { background:#2a241d; }
  .item.on { background:#332b22; border-left-color:#c8a56a; }
  .item .num { color:#8d7f70; font-size:12px; letter-spacing:.16em; min-width:52px; }
  .item .nm { font-size:15px; letter-spacing:.04em; }

  main { position:relative; overflow:hidden; cursor:grab; }
  main.drag { cursor:grabbing; }
  #stage { position:absolute; inset:0; }
  #plate {
    position:absolute; left:50%; top:50%; transform-origin:center;
    will-change:transform; box-shadow:0 30px 90px rgba(0,0,0,.65);
    user-select:none; -webkit-user-drag:none; max-width:none;
  }
  #hud {
    position:absolute; left:0; right:0; bottom:0; padding:20px 26px 22px;
    background:linear-gradient(transparent, rgba(10,8,6,.92) 55%);
    pointer-events:none;
  }
  #hud h2 {
    margin:0 0 4px; font-weight:400; font-size:22px; letter-spacing:.14em;
    text-transform:uppercase;
  }
  #hud .sub { margin:0 0 10px; color:#b3a390; font-style:italic; font-size:14px; }
  #hud p { margin:0; max-width:70ch; line-height:1.6; font-size:14px; color:#ded3bf; }
  .zoom { position:absolute; right:20px; top:18px; display:flex; gap:8px; }
  .zoom button {
    width:34px; height:34px; border-radius:50%; border:1px solid var(--rule);
    background:rgba(33,28,22,.85); color:var(--paper); font-size:17px; cursor:pointer;
  }
  .zoom button:hover { background:#3a3128; }
</style>
</head>
<body>
  <aside>
    <h1>Atlas</h1>
    <div class="tag">countries that were never surveyed</div>
    <div class="list" id="list"></div>
  </aside>

  <main id="main">
    <div id="stage"><img id="plate" alt=""></div>
    <div class="zoom">
      <button id="in" title="zoom in">+</button>
      <button id="out" title="zoom out">&minus;</button>
      <button id="fit" title="fit">&#9633;</button>
    </div>
    <div id="hud">
      <h2 id="t"></h2>
      <p class="sub" id="s"></p>
      <p id="p"></p>
    </div>
  </main>

<script>
const PLATES = [{"image": "atlas_0001.png", "title": "Chouchuldora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Chouchuldora lies between the 46th and 61st parallels.  Of the ground within the neat line, 35 parts in a hundred are land. The Cobor breaks upon its western shore, and the Negaufai closes it to the east.", "The ground rises to 3,353 metres. The Hisidu carry the highest of it.", "The Vouvraubeing is the longest of the rivers shown, 1,010 kilometres from its source to the marshes. The Trauveivreir is next at 700 kilometres, draining 149,000 square kilometres. Lakes take up 11.5 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Rochaulesse, Nonuvale, Kipinland, Raibaath and Thethora, of which Rochaulesse is the largest at 448,000 square kilometres. The seat is at Geberholm. No part of this country has been visited twice."], "plate": "PLATE I"}, {"image": "atlas_0001_political.png", "title": "Chouchuldora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE II"}, {"image": "atlas_0003.png", "title": "Svaevraereach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Svaevraereach lies between the 40th and 56th parallels.  Of the ground within the neat line, 34 parts in a hundred are land. The Zibrauwau breaks upon its western shore, and the Khogoskohol closes it to the east.", "The ground rises to 3,212 metres. The Zaudhoute carry the highest of it.", "The Bresusia is the longest of the rivers shown, 830 kilometres from its source to the sea. The Haubrubrith is next at 670 kilometres, draining 96,000 square kilometres. Lakes take up 10.5 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Bruwora, Kheifosmoor, Saukhausmark, Gousvouholt and Zautoora, of which Bruwora is the largest at 381,000 square kilometres. The seat is at Dhekharbridge, and Gaesvaiholm stands furthest from its neighbours, 223 kilometres. No part of this country has been visited twice."], "plate": "PLATE VI"}, {"image": "atlas_0003_political.png", "title": "Svaevraereach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE VII"}, {"image": "atlas_0004.png", "title": "Gianiareach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Gianiareach lies between the 30th and 46th parallels.  Of the ground within the neat line, 41 parts in a hundred are land. The Disvo breaks upon its western shore.", "The ground rises to 3,037 metres. The Kaidrurn carry the highest of it.", "The Nauzoupia is the longest of the rivers shown, 870 kilometres from its source to the sea. The Wiapouwou is next at 870 kilometres, draining 179,000 square kilometres. Lakes take up 8.4 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Heinauland, Bubianvale, Cushia, Tritheiskath and Mautroreach, of which Heinauland is the largest at 460,000 square kilometres. The seat is at Kubousthorpe, and Cauwouhaven stands furthest from its neighbours, 219 kilometres. No part of this country has been visited twice."], "plate": "PLATE XI"}, {"image": "atlas_0004_political.png", "title": "Gianiareach", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE XII"}, {"image": "atlas_0007.png", "title": "Dhiapirnora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Dhiapirnora lies between the 47th and 63rd parallels.  Of the ground within the neat line, 40 parts in a hundred are land. The Gaisaugai breaks upon its western shore, and the Treitru closes it to the east.", "The ground rises to 3,111 metres. The Fiacoukha carry the highest of it.", "The Fianaitiald is the longest of the rivers shown, 870 kilometres from its source to the sea. The Meigur is next at 570 kilometres, draining 87,000 square kilometres. Lakes take up 12.8 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Foustiora, Giagaimoor, Khiafireach, Baisheiland and Stiastousora, of which Foustiora is the largest at 315,000 square kilometres. The seat is at Beikeiford, and Groufiasholm stands furthest from its neighbours, 223 kilometres. No part of this country has been visited twice."], "plate": "PLATE XVI"}, {"image": "atlas_0007_political.png", "title": "Dhiapirnora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE XVII"}, {"image": "atlas_0012.png", "title": "Chebraora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Chebraora lies between the 33rd and 49th parallels.  Of the ground within the neat line, 34 parts in a hundred are land. The Niaski breaks upon its western shore, and the Tretraunem closes it to the east.", "The ground rises to 3,410 metres. The Truhiam carry the highest of it.", "The Grotritru is the longest of the rivers shown, 970 kilometres from its source to the sea. The Waewaerae is next at 600 kilometres, draining 165,000 square kilometres. Lakes take up 9.3 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Pilautwyn, Nekhaewyn, Braevaunath, Huskemark and Vriaskianmoor, of which Pilautwyn is the largest at 469,000 square kilometres. The seat is at Gruglirthorpe, and Laukanburg stands furthest from its neighbours, 239 kilometres. No part of this country has been visited twice."], "plate": "PLATE XXI"}, {"image": "atlas_0012_political.png", "title": "Chebraora", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE XXII"}, {"image": "atlas_0021.png", "title": "Khuvrurkath", "subtitle": "a survey of the country, in 5 provinces", "paras": ["Khuvrurkath lies between the 36th and 51st parallels.  Of the ground within the neat line, 37 parts in a hundred are land. The Shaipand breaks upon its western shore, and the Thakhothithu closes it to the east.", "The ground rises to 2,828 metres. The Shamastoucu carry the highest of it.", "The Chushosto is the longest of the rivers shown, 870 kilometres from its source to the sea. The Biaros is next at 870 kilometres, draining 76,000 square kilometres. Lakes take up 10.4 parts in a hundred of the land, most of them strung along the greater courses.", "The country is divided into Vrestoia, Zaigrarkia, Gesviskath, Yumairheim and Beithasia, of which Vrestoia is the largest at 380,000 square kilometres. The seat is at Stoushouwick, and Kauzanholm stands furthest from its neighbours, 215 kilometres. No part of this country has been visited twice."], "plate": "PLATE XXVI"}, {"image": "atlas_0021_political.png", "title": "Khuvrurkath", "subtitle": "a survey of the country, in 5 provinces", "paras": ["The same country drawn for the reader who wants the shape of its provinces rather than the shape of its hills."], "plate": "PLATE XXVII"}];
const img = document.getElementById('plate');
const main = document.getElementById('main');
const list = document.getElementById('list');
let cur = 0, scale = 1, tx = 0, ty = 0, base = 1;

function fitScale() {
  const pw = img.naturalWidth || 1, ph = img.naturalHeight || 1;
  const availW = main.clientWidth * 0.94, availH = main.clientHeight * 0.90;
  return Math.min(availW / pw, availH / ph);
}

function apply() {
  img.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`;
}

function reset() {
  base = fitScale();
  scale = base; tx = 0; ty = 0; apply();
}

function show(i) {
  cur = (i + PLATES.length) % PLATES.length;
  const d = PLATES[cur];
  img.src = d.image;
  document.getElementById('t').textContent = (d.plate ? d.plate + ' · ' : '') + d.title;
  document.getElementById('s').textContent = d.subtitle;
  document.getElementById('p').textContent = d.paras[0];
  [...list.children].forEach((el, k) => el.classList.toggle('on', k === cur));
  img.onload = reset;
}

PLATES.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<span class="num">${d.plate || ''}</span><span class="nm">${d.title}</span>`;
  el.onclick = () => show(i);
  list.appendChild(el);
});

main.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0016);
  const next = Math.min(Math.max(scale * k, base * 0.6), base * 12);
  const r = main.getBoundingClientRect();
  const mx = e.clientX - r.left - r.width / 2;
  const my = e.clientY - r.top - r.height / 2;
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next; apply();
}, { passive: false });

let down = false, lx = 0, ly = 0;
main.addEventListener('pointerdown', e => {
  down = true; lx = e.clientX; ly = e.clientY; main.classList.add('drag');
});
window.addEventListener('pointerup', () => { down = false; main.classList.remove('drag'); });
window.addEventListener('pointermove', e => {
  if (!down) return;
  tx += e.clientX - lx; ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY; apply();
});

document.getElementById('in').onclick = () => { scale *= 1.35; apply(); };
document.getElementById('out').onclick = () => { scale /= 1.35; apply(); };
document.getElementById('fit').onclick = reset;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
window.addEventListener('resize', reset);

show(0);
</script>
</body>
</html>
